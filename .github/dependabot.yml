# 依存パッケージの更新を自動でチェックし、更新があればPRを作る設定
version: 2
updates:
  # PHPのパッケージ（composer.json / composer.lock はリポジトリ直下にある）
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # compose.yaml で使っているイメージ（mysql など）
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
